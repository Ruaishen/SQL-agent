[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent-rl"
version = "0.1.0"
description = "A deterministic, read-only interactive SQL agent environment for Spider 1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.2",
  "sqlglot==30.17.0",
  "apted==1.0.3",
  "tokenizers==0.22.2",
  "typer==0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]
train = [
  "torch==2.8.0",
  "transformers==4.57.1",
]

[project.scripts]
sql-agent-preprocess = "data.preprocess_spider:app"
sql-agent-eval = "evaluation.run_eval:app"
sql-agent-sft-collect = "sft.collect:main"
sql-agent-sft-status = "sft.status:main"
sql-agent-sft-train = "sft.train:main"
sql-agent-sft-train-status = "sft.train_status:main"
sql-agent-grpo-prepare = "grpo.prepare:main"
sql-agent-grpo-train = "grpo.train:main"
sql-agent-grpo-status = "grpo.status:main"
sql-planner-collect = "sql_planner.collect:main"
sql-planner-collect-spider = "sql_planner.collect_spider_train:main"
sql-agent-sql-similarity = "evaluation.sql_similarity:main"

[tool.setuptools.packages.find]
include = ["sql_agent*", "sql_planner*", "data*", "evaluation*", "sft*", "grpo*", "third_party*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
