# Native GRPO method 2. Edit local model/data paths before prepare/train.
student_model: /path/to/student_checkpoint
reference_model: /path/to/student_checkpoint
train_data: data/train.jsonl
output_dir: artifacts/grpo/method2
seed: 42
interaction_protocol: reasoning_tool
gold_injection: false
method2_guided_injection: true
method2_max_attempts: 3
method2_audit_model: deepseek-v4-flash
method2_audit_key_env: DEEPSEEK_API_KEY
method2_audit_base_url: https://api.deepseek.com
method2_audit_max_tokens: 8192
reward_mode: binary_execution
max_steps: 128
prompts_per_step: 4
rollouts_per_prompt: 6
easy_tasks: 114
medium_tasks: 177
hard_tasks: 120
extra_tasks: 101
max_assistant_turns: 10
max_sequence_tokens: 16384
max_action_tokens: 2048
temperature: 1.0
top_p: 1.0
top_k: null
clip_ratio: 0.2
clip_ratio_high: 0.2
kl_beta: 0.0
learning_rate: 1.0e-6
gradient_clip_norm: 1.0
update_micro_batch_size: 8
reference_score_micro_batch_size: 16
gradient_checkpointing: true
target_gpu_memory_utilization: 0.90
checkpoint_interval: 64
